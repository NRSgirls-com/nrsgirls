name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  lint-and-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nrsgirls-platform/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-node22-yarn-${{ hashFiles('nrsgirls-platform/frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node22-yarn-

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive --cache-folder ~/.cache/yarn

      - name: Lint and test
        run: bash ../scripts/lint-test.sh

      - name: Build frontend
        run: yarn build
