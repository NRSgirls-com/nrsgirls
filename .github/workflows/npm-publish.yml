name: Validate release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      # Private application: no npm publishing or hosting deployment.
