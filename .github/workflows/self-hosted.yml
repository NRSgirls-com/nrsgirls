name: Self-hosted platform
on:
  push:
    paths: ['self-hosted/**', 'package.json', '.github/workflows/self-hosted.yml']
  pull_request:
    paths: ['self-hosted/**', 'package.json', '.github/workflows/self-hosted.yml']
permissions:
  contents: read
jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
